<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="qracle-main-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="85%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Text Gradient for AI -->
    <linearGradient id="qracle-ai-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Core Center Radial Glow -->
    <radialGradient id="qracle-core-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for luminous glow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="halo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- ================= EMBLEM GROUP ================= -->
  <g transform="translate(4, 2) scale(0.5)">
    <!-- Ambient Halo -->
    <circle cx="46" cy="42" r="32" fill="#22D3EE" fill-opacity="0.2" filter="url(#halo-glow)" />
    <circle cx="76" cy="72" r="10" fill="#38BDF8" fill-opacity="0.3" filter="url(#halo-glow)" />

    <!-- Outer Q-Ring -->
    <circle
      cx="46"
      cy="42"
      r="30"
      stroke="url(#qracle-main-grad)"
      stroke-width="5"
      stroke-linecap="round"
      filter="url(#logo-glow)"
    />

    <!-- Inner Quantum Network Lines -->
    <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- Star rays from center -->
      <line x1="46" y1="42" x2="46" y2="20" />
      <line x1="46" y1="42" x2="28" y2="26" />
      <line x1="46" y1="42" x2="22" y2="42" />
      <line x1="46" y1="42" x2="29" y2="58" />
      <line x1="46" y1="42" x2="64" y2="26" />
      <line x1="46" y1="42" x2="63" y2="59" />

      <!-- Outer mesh cross-connects -->
      <line x1="28" y1="26" x2="46" y2="20" opacity="0.5" />
      <line x1="46" y1="20" x2="64" y2="26" opacity="0.5" />
      <line x1="28" y1="26" x2="22" y2="42" opacity="0.5" />
      <line x1="22" y1="42" x2="29" y2="58" opacity="0.5" />
    </g>

    <!-- Q-Tail (Extended diagonal handle with terminal node) -->
    <path
      d="M 60 56 L 76 72"
      stroke="url(#qracle-main-grad)"
      stroke-width="6"
      stroke-linecap="round"
      filter="url(#logo-glow)"
    />

    <!-- Terminal Tail Node -->
    <circle cx="76" cy="72" r="5" fill="#22D3EE" filter="url(#logo-glow)" />
    <circle cx="76" cy="72" r="2.5" fill="#FFFFFF" />

    <!-- Satellite Network Nodes -->
    <g fill="#22D3EE" filter="url(#logo-glow)">
      <circle cx="46" cy="20" r="3.4" />
      <circle cx="28" cy="26" r="3" />
      <circle cx="22" cy="42" r="3.2" />
      <circle cx="29" cy="58" r="3" />
      <circle cx="64" cy="26" r="3.2" />
      <circle cx="63" cy="59" r="3.5" />
    </g>

    <!-- Node Inner White Highlights -->
    <g fill="#FFFFFF">
      <circle cx="46" cy="20" r="1.4" />
      <circle cx="28" cy="26" r="1.2" />
      <circle cx="22" cy="42" r="1.3" />
      <circle cx="29" cy="58" r="1.2" />
      <circle cx="64" cy="26" r="1.3" />
      <circle cx="63" cy="59" r="1.5" />
    </g>

    <!-- Center Core Quantum Node -->
    <circle cx="46" cy="42" r="10" fill="url(#qracle-core-rad)" filter="url(#logo-glow)" />
    <circle cx="46" cy="42" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(62, 0)">
    <!-- Primary Brand Wordmark -->
    <text
      x="0"
      y="32"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif"
      font-weight="800"
      font-size="25"
      letter-spacing="-0.03em"
      fill="#FFFFFF"
    >
      Qracle<tspan fill="url(#qracle-ai-grad)" filter="url(#logo-glow)">AI</tspan>
    </text>

    <!-- Sub-tagline -->
    <text
      x="1"
      y="45"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif"
      font-weight="600"
      font-size="7.5"
      letter-spacing="0.25em"
      fill="#38BDF8"
      opacity="0.9"
    >
      QUANTUM INTELLIGENCE
    </text>
  </g>
</svg>
