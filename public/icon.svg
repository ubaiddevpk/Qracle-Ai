<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Royal Blue Gradient for Ring -->
    <linearGradient id="qracle-ring-grad" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#22D3EE" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Core Center Radial Glow -->
    <radialGradient id="qracle-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="qracle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Halo Filter -->
    <filter id="ambient-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="46" cy="42" r="30" fill="#22D3EE" fill-opacity="0.18" filter="url(#ambient-halo)" />
  <circle cx="76" cy="72" r="10" fill="#38BDF8" fill-opacity="0.25" filter="url(#ambient-halo)" />

  <!-- Outer Q-Ring -->
  <circle
    cx="46"
    cy="42"
    r="30"
    stroke="url(#qracle-ring-grad)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#qracle-glow)"
  />

  <!-- Inner Quantum Network Lines -->
  <g stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Star rays from center -->
    <line x1="46" y1="42" x2="46" y2="20" />
    <line x1="46" y1="42" x2="28" y2="26" />
    <line x1="46" y1="42" x2="22" y2="42" />
    <line x1="46" y1="42" x2="29" y2="58" />
    <line x1="46" y1="42" x2="64" y2="26" />
    <line x1="46" y1="42" x2="63" y2="59" />

    <!-- Outer mesh cross-connects -->
    <line x1="28" y1="26" x2="46" y2="20" opacity="0.45" />
    <line x1="46" y1="20" x2="64" y2="26" opacity="0.45" />
    <line x1="28" y1="26" x2="22" y2="42" opacity="0.45" />
    <line x1="22" y1="42" x2="29" y2="58" opacity="0.45" />
  </g>

  <!-- Q-Tail (Extended diagonal handle with terminal node) -->
  <path
    d="M 60 56 L 76 72"
    stroke="url(#qracle-ring-grad)"
    stroke-width="6"
    stroke-linecap="round"
    filter="url(#qracle-glow)"
  />

  <!-- Terminal Tail Node -->
  <circle cx="76" cy="72" r="5" fill="#22D3EE" filter="url(#qracle-glow)" />
  <circle cx="76" cy="72" r="2.5" fill="#FFFFFF" />

  <!-- Satellite Network Nodes -->
  <g fill="#22D3EE" filter="url(#qracle-glow)">
    <circle cx="46" cy="20" r="3.2" />
    <circle cx="28" cy="26" r="2.8" />
    <circle cx="22" cy="42" r="3" />
    <circle cx="29" cy="58" r="2.8" />
    <circle cx="64" cy="26" r="3" />
    <circle cx="63" cy="59" r="3.4" />
  </g>

  <!-- Node Inner White Highlights -->
  <g fill="#FFFFFF">
    <circle cx="46" cy="20" r="1.3" />
    <circle cx="28" cy="26" r="1.1" />
    <circle cx="22" cy="42" r="1.2" />
    <circle cx="29" cy="58" r="1.1" />
    <circle cx="64" cy="26" r="1.2" />
    <circle cx="63" cy="59" r="1.4" />
  </g>

  <!-- Center Core Quantum Node -->
  <circle cx="46" cy="42" r="10" fill="url(#qracle-core-glow)" filter="url(#qracle-glow)" />
  <circle cx="46" cy="42" r="4.5" fill="#FFFFFF" />
</svg>
