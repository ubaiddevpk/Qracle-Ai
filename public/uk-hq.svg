<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#0E1E38" />
    </linearGradient>

    <linearGradient id="glass-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#14233C" />
      <stop offset="100%" stop-color="#09101C" />
    </linearGradient>

    <linearGradient id="mullion-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05" />
    </linearGradient>

    <filter id="win-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- Night Sky Base -->
  <rect width="800" height="500" fill="url(#sky-grad)" />

  <!-- Skyscraper Perspective Facade (Angled Modern Glass Tower) -->
  <g opacity="0.75">
    <!-- Main Tower Facet Left -->
    <path d="M -50 550 L 320 -50 L 450 -50 L 180 550 Z" fill="url(#glass-grad)" />
    <!-- Tower Facet Right -->
    <path d="M 180 550 L 450 -50 L 850 50 L 720 550 Z" fill="#0A1322" />

    <!-- Grid Window Strips (Angled Horizontal Floor Bands) -->
    <g stroke="url(#mullion-grad)" stroke-width="2.5">
      <line x1="120" y1="40" x2="680" y2="110" />
      <line x1="90" y1="80" x2="690" y2="150" />
      <line x1="60" y1="120" x2="700" y2="190" />
      <line x1="30" y1="160" x2="710" y2="230" />
      <line x1="0" y1="200" x2="720" y2="270" />
      <line x1="-30" y1="240" x2="730" y2="310" />
      <line x1="-60" y1="280" x2="740" y2="350" />
      <line x1="-90" y1="320" x2="750" y2="390" />
      <line x1="-120" y1="360" x2="760" y2="430" />
      <line x1="-150" y1="400" x2="770" y2="470" />
      <line x1="-180" y1="440" x2="780" y2="510" />
    </g>

    <!-- Vertical Mullions -->
    <g stroke="#1E293B" stroke-width="2" opacity="0.6">
      <line x1="200" y1="0" x2="100" y2="500" />
      <line x1="260" y1="0" x2="180" y2="500" />
      <line x1="320" y1="0" x2="260" y2="500" />
      <line x1="380" y1="0" x2="340" y2="500" />
      <line x1="440" y1="0" x2="420" y2="500" />
      <line x1="500" y1="0" x2="500" y2="500" />
      <line x1="560" y1="0" x2="580" y2="500" />
      <line x1="620" y1="0" x2="660" y2="500" />
      <line x1="680" y1="0" x2="740" y2="500" />
    </g>

    <!-- Illuminated Windows (Warm and Cyan Glow) -->
    <g fill="#38BDF8" opacity="0.4" filter="url(#win-glow)">
      <rect x="220" y="70" width="25" height="6" transform="skewY(7)" />
      <rect x="260" y="75" width="30" height="6" transform="skewY(7)" />
      <rect x="350" y="85" width="40" height="6" transform="skewY(7)" />
      <rect x="420" y="92" width="20" height="6" transform="skewY(7)" />
      <rect x="180" y="110" width="35" height="6" transform="skewY(7)" />
      <rect x="300" y="125" width="50" height="6" transform="skewY(7)" />
      <rect x="480" y="145" width="30" height="6" transform="skewY(7)" />
      <rect x="140" y="150" width="25" height="6" transform="skewY(7)" />
      <rect x="230" y="160" width="45" height="6" transform="skewY(7)" />
      <rect x="380" y="175" width="35" height="6" transform="skewY(7)" />
      <rect x="520" y="190" width="40" height="6" transform="skewY(7)" />
      <rect x="200" y="200" width="30" height="6" transform="skewY(7)" />
      <rect x="280" y="210" width="40" height="6" transform="skewY(7)" />
      <rect x="440" y="225" width="25" height="6" transform="skewY(7)" />
      <rect x="160" y="240" width="50" height="6" transform="skewY(7)" />
      <rect x="340" y="260" width="30" height="6" transform="skewY(7)" />
      <rect x="490" y="275" width="35" height="6" transform="skewY(7)" />
      <rect x="220" y="285" width="40" height="6" transform="skewY(7)" />
      <rect x="390" y="305" width="45" height="6" transform="skewY(7)" />
      <rect x="290" y="330" width="35" height="6" transform="skewY(7)" />
      <rect x="460" y="350" width="30" height="6" transform="skewY(7)" />
    </g>

    <!-- Warm Golden Light Highlights -->
    <g fill="#FDE047" opacity="0.3" filter="url(#win-glow)">
      <rect x="295" y="78" width="20" height="6" transform="skewY(7)" />
      <rect x="225" y="115" width="25" height="6" transform="skewY(7)" />
      <rect x="410" y="135" width="30" height="6" transform="skewY(7)" />
      <rect x="170" y="195" width="20" height="6" transform="skewY(7)" />
      <rect x="325" y="215" width="25" height="6" transform="skewY(7)" />
      <rect x="265" y="290" width="20" height="6" transform="skewY(7)" />
    </g>
  </g>

  <!-- Ambient Bottom Vignette -->
  <rect y="250" width="800" height="250" fill="url(#sky-grad)" opacity="0.8" />
</svg>
